name: ic_card_reader
description: Privacy-first Japanese transit IC card history reader PoC.
publish_to: none
version: 1.0.0+14

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Local 4.2.1 patch: ignore Samsung vendor NFC adapter state 5 instead of
  # crashing the Android broadcast receiver.
  nfc_manager:
    path: third_party/nfc_manager
  supabase_flutter: ^2.16.0
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/pass_comparison/
    - assets/data/stations/
    - assets/licenses/
